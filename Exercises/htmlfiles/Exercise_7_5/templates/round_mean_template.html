<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    {% if Title %}
        <title>{{Title}}</title>
    {% else %}
        <title>Round</title>
    {% endif %}
</head>
<body>
    <center>
        <table border="1" width="500px" height="700px">
            {% for competitor_data in data_set %}
            <tr>
                <td>{{ competitor_data[0] }}</td>
                <td>{{ competitor_data[1] }}</td>
            </tr>
        {% endfor %}
        </table>
    </center>
</html>
