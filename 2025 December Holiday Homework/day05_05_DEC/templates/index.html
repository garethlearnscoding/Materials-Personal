<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Image</title>
    </head>
    <body>
        <table>
            {% for i in data %}
            <tr>
                {% for j in i %}

                {% endfor %}
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
